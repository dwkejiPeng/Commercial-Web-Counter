# Commercial Web Counter SaaS - Nginx example
# Important: root must point to /public, not project root.

server {
    listen 80;
    server_name counter.example.com;

    root /var/www/commercial-web-counter-saas/public;
    index index.php index.html;

    charset utf-8;

    location = /counter.js {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        expires 10m;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # These directories are outside public when root is configured correctly.
    # Keep this as extra protection if you change deployment layout.
    location ~* /(app|database)/ {
        deny all;
    }
}
